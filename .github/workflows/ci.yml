name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture scaffold checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify required documents and boundaries
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/database.md
          test -f docs/api.md
          test -f docs/ai-agents.md
          test -f docs/microservices.md
          test -f docs/security.md
          test -f docs/permissions.md
          test -f docs/dashboard-wireframes.md
          test -f docs/deployment.md
          test -f docs/developer-guide.md
          test -f docs/coding-standards.md
          test -f docs/testing-strategy.md
          test -f docs/cicd.md
          test -f docs/operations.md
          test -f docs/roadmap.md
          test -f packages/database/prisma/schema.prisma
          test -f apps/web/README.md
          test -f apps/api/README.md
          test -f apps/worker/README.md
      - name: Check whitespace errors
        run: git diff --check HEAD~1 HEAD || true

  quality:
    name: Application quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
